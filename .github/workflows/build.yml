# Builds the agent and the server stack on every push and pull request and
# pushes the results to a Cachix binary cache.
#
# Setup, once:
#   1. Create a cache at https://app.cachix.org and copy its public key into
#      the README section "Use the binary cache" and into flake.nix nixConfig.
#   2. Add the cache's auth token as the repository secret CACHIX_AUTH_TOKEN.
#   3. If the cache is not named wazuh, set the repository variable
#      CACHIX_CACHE to its name.
#
# The checkout omits the modules/wazuh submodule on purpose. The package then
# fetches the same commit from GitHub, which is also what a consumer of this
# flake gets, so the store paths that land in the cache are the ones they need.
#
# Pushes to main and to integration/server-stack publish to the cache. Pull
# requests build but do not push: a pull request from a fork has no secrets.
#
# Every bounded flake check runs for pushes, PRs and manual dispatches.
# checks.integration remains separate: its 12-hour limit exceeds the
# six-hour hosted job limit. Package closures travel through artifacts,
# including on fork PRs without cache-write credentials.

name: build

on:
  push:
    branches:
      - main
      - integration/server-stack
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CACHIX_CACHE: ${{ vars.CACHIX_CACHE || 'wazuh' }}

jobs:
  build:
    name: agent (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            # Free for public repositories. For a private repository, drop this
            # entry or point it at a self-hosted ARM runner.
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The runner image ships toolchains that this build never uses. The
        # Wazuh dependency tarballs and the build tree need the room.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - uses: cachix/cachix-action@v16
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' }}

      - name: Build packages
        run: |
          nix build -L --no-link \
            .#packages.${{ matrix.system }}.wazuh-agent \
            .#packages.${{ matrix.system }}.wazuh-testing

      - name: Show closure size
        run: |
          nix path-info -S -h .#packages.${{ matrix.system }}.wazuh-agent

      - name: Export agent packages for tests
        if: matrix.system == 'x86_64-linux'
        run: bash .github/scripts/export-closure.sh "$RUNNER_TEMP/agent-closure.nar.zst" .#packages.x86_64-linux.wazuh-agent .#packages.x86_64-linux.wazuh-testing

      - uses: actions/upload-artifact@v4
        if: matrix.system == 'x86_64-linux'
        with:
          name: agent-closure
          path: ${{ runner.temp }}/agent-closure.nar.zst
          compression-level: 0
          retention-days: 1

  build-server:
    # The server stack is x86_64-linux only: filebeat-oss ships as an x86_64
    # rpm, and the indexer and dashboard packages unpack amd64 archives.
    name: server stack (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - uses: cachix/cachix-action@v16
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' }}

      - name: Build the server stack
        # wazuh-server builds CPython and the manager from source. On a hosted
        # runner this is the long step; the cache makes the next run short.
        run: |
          nix build -L --no-link \
            .#packages.x86_64-linux.wazuh-server \
            .#packages.x86_64-linux.wazuh-indexer \
            .#packages.x86_64-linux.wazuh-dashboard \
            .#packages.x86_64-linux.filebeat-oss

      - name: Source-level checks
        # No VM. server-package inspects the built server; options-documented
        # fails when a module option is missing from the READMEs.
        shell: bash
        run: |
          nix eval --json .#checks.x86_64-linux --apply builtins.attrNames > "$RUNNER_TEMP/check-names.json"
          python3 .github/scripts/check-coverage.py "$RUNNER_TEMP/check-names.json"
          mapfile -t checks < .github/non-vm-checks.txt
          bash .github/scripts/run-checks.sh "$RUNNER_TEMP/source-check-logs" "${checks[@]}"

      - name: Preserve source-check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-check-logs
          path: ${{ runner.temp }}/source-check-logs
          if-no-files-found: warn
          retention-days: 14

      - name: Show closure sizes
        run: |
          nix path-info -S -h \
            .#packages.x86_64-linux.wazuh-server \
            .#packages.x86_64-linux.wazuh-indexer \
            .#packages.x86_64-linux.wazuh-dashboard

      - name: Export server packages for tests
        run: bash .github/scripts/export-closure.sh "$RUNNER_TEMP/server-closure.nar.zst" .#packages.x86_64-linux.wazuh-server .#packages.x86_64-linux.wazuh-indexer .#packages.x86_64-linux.wazuh-dashboard .#packages.x86_64-linux.filebeat-oss

      - uses: actions/upload-artifact@v4
        with:
          name: server-closure
          path: ${{ runner.temp }}/server-closure.nar.zst
          compression-level: 0
          retention-days: 1

  test:
    name: VM checks / ${{ matrix.group }} (x86_64-linux)
    needs: [build, build-server]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [core, cluster, indexing, stack, container]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space and provision swap for multi-VM checks
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo fallocate -l 12G /swapfile-wazuh-ci
          sudo chmod 600 /swapfile-wazuh-ci
          sudo mkswap /swapfile-wazuh-ci
          sudo swapon /swapfile-wazuh-ci
          free -h
          df -h /

      - name: Enable KVM
        # GitHub's Linux runners expose /dev/kvm, but only root can open it.
        # The Nix build users need it for the NixOS VM test.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
            # Only same-run build artifacts are imported, on ephemeral hosts.
            trusted-users = root runner

      - uses: cachix/cachix-action@v16
        with:
          name: ${{ env.CACHIX_CACHE }}
          # The test VM closure is large and nobody substitutes it. Read the
          # packages from the cache, push nothing.
          skipPush: true

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-closure'
          merge-multiple: true
          path: ${{ runner.temp }}/closures

      - name: Import the packages built by this workflow
        run: |
          for archive in "$RUNNER_TEMP"/closures/*.nar.zst; do
            zstd -dc "$archive" | nix-store --import > /dev/null
            rm "$archive"
          done

      - name: Run all bounded VM checks sequentially
        shell: bash
        run: |
          mapfile -t checks < ".github/vm-checks/${{ matrix.group }}.txt"
          bash .github/scripts/run-checks.sh "$RUNNER_TEMP/check-logs" "${checks[@]}"

      - name: Preserve test logs and derivation paths
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-check-logs-${{ matrix.group }}
          path: ${{ runner.temp }}/check-logs
          if-no-files-found: warn
          retention-days: 14
